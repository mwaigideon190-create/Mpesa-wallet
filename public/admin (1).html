<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Admin</title>
<style>
  :root { --bg:#0f1620; --card:#18222f; --line:#2a3646; --text:#e8eef5; --mute:#8fa0b3; --green:#2ea44f; --red:#d9534f; --amber:#e0a030; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  input { width:100%; padding:12px; margin:6px 0; border-radius:8px; border:1px solid var(--line); background:#0b1119; color:var(--text); font-size:16px; }
  button { padding:11px 14px; border:0; border-radius:8px; background:#2b3a4d; color:var(--text); font-size:15px; font-weight:600; cursor:pointer; }
  button.go { background:var(--green); } button.bad { background:var(--red); } button.warn { background:var(--amber); color:#111; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1; }
  nav { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; }
  nav button { flex:none; } nav button.on { background:var(--green); }
  .err { color:#ff8a85; margin:8px 0; min-height:1.2em; } .ok { color:#6fd68a; }
  .big { font-size:26px; font-weight:700; } .mute { color:var(--mute); font-size:14px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:#2b3a4d; }
  .tag.suspended, .tag.failed { background:var(--red); } .tag.success, .tag.active { background:#1e6b3a; } .tag.pending, .tag.review { background:var(--amber); color:#111; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>Wallet Admin</h1>

  <div id="login" class="card">
    <input id="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="go" id="loginBtn" style="width:100%;margin-top:8px">Log in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="app" class="hide">
    <nav id="nav">
      <button data-v="summary" class="on">Summary</button>
      <button data-v="users">Users</button>
      <button data-v="agent">Agent</button>
      <button data-v="txs">Transactions</button>
      <button data-v="log">Log</button>
      <button id="logout">Log out</button>
    </nav>
    <div class="err" id="msg"></div>
    <div id="view"></div>
  </div>
</main>

<script>
let token = null;
try { token = sessionStorage.getItem('adminToken'); } catch (e) {}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const kes = (n) => 'KES ' + Number(n || 0).toLocaleString();
const when = (t) => esc(String(t || '').slice(0, 16));

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) });
const say = (t, good) => { const m = $('#msg'); m.textContent = t || ''; m.className = 'err' + (good ? ' ok' : ''); };

async function login() {
  $('#loginErr').textContent = '';
  try {
    const r = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('#email').value, password: $('#pw').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Login failed');
    if (j.role !== 'admin') throw new Error('This account is not an admin');
    token = j.token;
    try { sessionStorage.setItem('adminToken', token); } catch (e) {}
    start();
  } catch (e) { $('#loginErr').textContent = e.message; }
}

async function start() {
  try { await api('/admin/summary'); } catch (e) { token = null; try { sessionStorage.removeItem('adminToken'); } catch (x) {} return; }
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  show('summary');
}

function show(v) {
  document.querySelectorAll('#nav button[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  say('');
  ({ summary, users, agent, txs, log }[v])().catch((e) => say(e.message));
}

async function summary() {
  const s = await api('/admin/summary');
  $('#view').innerHTML = `
    <div class="card"><div class="mute">Total in wallets</div><div class="big">${kes(s.total_balance)}</div></div>
    <div class="row"><div class="card"><div class="mute">Users</div><div class="big">${esc(s.users)}</div></div>
    <div class="card"><div class="mute">Pending</div><div class="big">${esc(s.pending)}</div></div></div>
    <div class="row"><div class="card"><div class="mute">In today</div><div class="big">${kes(s.in_today)}</div></div>
    <div class="card"><div class="mute">Out today</div><div class="big">${kes(s.out_today)}</div></div></div>`;
}

async function users(q = '') {
  const list = await api('/admin/users?q=' + encodeURIComponent(q));
  $('#view').innerHTML = `<input id="q" placeholder="Search email or phone" value="${esc(q)}">` +
    list.map((u) => `<div class="card">
      <div><b>${esc(u.email)}</b> <span class="tag ${esc(u.status)}">${esc(u.status)}</span>${u.role === 'admin' ? ' <span class="tag">admin</span>' : ''}</div>
      <div class="mute">${esc(u.phone)} · ${kes(u.balance)} · ${when(u.created_at)}</div>
      ${u.role === 'admin' ? '' : `<div class="row" style="margin-top:8px">
        <button class="${u.status === 'active' ? 'warn' : 'go'}" data-act="status" data-id="${esc(u.id)}" data-to="${u.status === 'active' ? 'suspended' : 'active'}">${u.status === 'active' ? 'Suspend' : 'Activate'}</button>
        <button data-act="reset" data-id="${esc(u.id)}">Reset password</button></div>`}
    </div>`).join('') || '<div class="mute">No users found.</div>';
  $('#q').addEventListener('change', (e) => users(e.target.value).catch((x) => say(x.message)));
}

async function agent() {
  $('#view').innerHTML = `<div class="card">
    <div class="mute">Customer phone, amount and note. Every move is recorded in the Log.</div>
    <input id="aphone" inputmode="tel" placeholder="Customer phone (07XXXXXXXX)">
    <input id="aamt" inputmode="numeric" placeholder="Amount (KES)">
    <input id="anote" placeholder="Note (optional)">
    <div class="row" style="margin-top:8px">
      <button class="go" data-act="cashin">Cash in</button>
      <button class="bad" data-act="cashout">Cash out</button></div></div>`;
}

async function txs() {
  const list = await api('/admin/transactions');
  $('#view').innerHTML = list.map((t) => `<div class="card">
    <div><b>${esc(t.kind)}</b> ${kes(t.amount)} <span class="tag ${esc(t.status)}">${esc(t.status)}</span></div>
    <div class="mute">${esc(t.email)} · ${when(t.created_at)}${t.receipt ? ' · ' + esc(t.receipt) : ''}</div></div>`).join('') || '<div class="mute">No transactions yet.</div>';
}

async function log() {
  const list = await api('/admin/log');
  $('#view').innerHTML = list.map((l) => `<div class="card">
    <div><b>${esc(l.action)}</b> · user #${esc(l.target_id)}</div>
    <div class="mute">${esc(l.detail)} · ${esc(l.admin)} · ${when(l.created_at)}</div></div>`).join('') || '<div class="mute">Nothing logged yet.</div>';
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.id === 'loginBtn') return login();
    if (b.id === 'logout') { try { sessionStorage.removeItem('adminToken'); } catch (x) {} token = null; return location.reload(); }
    if (b.dataset.v) return show(b.dataset.v);
    if (b.dataset.act === 'status') { await post(`/admin/users/${b.dataset.id}/status`, { status: b.dataset.to }); say('Updated', true); return users($('#q')?.value || ''); }
    if (b.dataset.act === 'reset') {
      const pw = prompt('New password for this user (8+ characters):'); if (!pw) return;
      await post(`/admin/users/${b.dataset.id}/reset-password`, { password: pw }); return say('Password reset. Tell the user their new password.', true);
    }
    if (b.dataset.act === 'cashin' || b.dataset.act === 'cashout') {
      const kind = b.dataset.act === 'cashin' ? 'cash-in' : 'cash-out';
      const body = { phone: $('#aphone').value, amount: $('#aamt').value, note: $('#anote').value };
      if (!confirm(`Confirm ${kind} of KES ${body.amount} for ${body.phone}?`)) return;
      await post('/admin/agent/' + kind, body);
      say('Done: ' + kind + ' recorded', true); $('#aamt').value = ''; $('#anote').value = '';
    }
  } catch (err) { say(err.message); }
});
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

if (token) start();
</script>
</body>
</html>
