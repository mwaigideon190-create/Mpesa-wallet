services:
  - type: web
    name: mpesa-wallet
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CALLBACK_SECRET
        generateValue: true
      - key: MPESA_ENV
        value: sandbox
      - key: SHORTCODE
        value: "174379"
      - key: CONSUMER_KEY
        sync: false
      - key: CONSUMER_SECRET
        sync: false
      - key: PASSKEY
        sync: false
      - key: INITIATOR_NAME
        sync: false
      - key: SECURITY_CREDENTIAL
        sync: false
