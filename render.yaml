services:
  - type: web
    name: tradecoin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # persistent disks are not available on the free plan
    healthCheckPath: /health
    disk:
      name: wallet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/wallet.db
      - key: JWT_SECRET
        generateValue: true
      - key: CALLBACK_SECRET
        generateValue: true
      - key: MPESA_ENV
        value: sandbox
      - key: SHORTCODE
        value: "174379"
      - key: USD_KES_RATE
        value: "129"
      - key: FX_SPREAD_PCT
        value: "1.5"
      - key: MIN_USD
        value: "2"
      - key: MAX_USD
        value: "1000"
      - key: AGENT_MAX_PER_MOVE
        value: "500"
      - key: AGENT_MAX_PER_DAY
        value: "2000"
      - key: GAME_FEE_PCT
        value: "5"
      - key: GAME_ROUND_SEC
        value: "30"
      - key: GAME_MIN_USD
        value: "0.2"
      - key: GAME_MAX_USD
        value: "100"
      - key: GAME_DAILY_LOSS_USD
        value: "200"
      - key: GAME_WIN_MULT
        value: "2"
      - key: GAME_TARGET_USD
        value: "150"
      - key: GAME_WIN_PCT_LOW
        value: "5"
      - key: GAME_WIN_PCT_HIGH
        value: "29"
      - key: MPESA_TOKEN_URL
        sync: false
      - key: KCB_BASE_URL
        sync: false
      - key: KCB_ACCOUNT_NUMBER
        sync: false
      - key: KCB_PAYOUTS
        value: "0"
      - key: CONSUMER_KEY
        sync: false
      - key: CONSUMER_SECRET
        sync: false
      - key: PASSKEY
        sync: false
      - key: INITIATOR_NAME
        sync: false
      - key: SECURITY_CREDENTIAL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
